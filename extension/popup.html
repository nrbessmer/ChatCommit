<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ChatCommit</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- ───────── LOGIN ───────── -->
  <div class="container" id="login-panel">
    <h1 class="header">ChatCommit</h1>

    <label for="login-email">Email</label>
    <input type="text" id="login-email" placeholder="you@example.com"/>

    <label for="login-password">Password</label>
    <input type="password" id="login-password" placeholder="your password"/>

    <button id="login-submit" class="btn primary">Log In</button>
    <p id="login-status" class="message"></p>
  </div>

  <!-- ───────── MAIN ───────── -->
  <div class="container" id="main-panel" style="display:none">
    <h1 class="header">ChatCommit</h1>

    <button id="refresh-chat" class="btn">Refresh</button>

    <section class="fieldset">
      <legend>Branch</legend>
      <select id="branch-select"></select>
      <button id="create-branch" class="btn small">New Branch</button>
    </section>

    <label for="message-input">Commit Message</label>
    <textarea id="message-input" rows="3" placeholder="Describe your changes"></textarea>

    <section class="fieldset">
      <legend>Context</legend>
      <textarea id="context-area" readonly></textarea>
      <button id="copy-context" class="btn small">Copy Context</button>
    </section>

    <label for="tag-input">Tag (optional)</label>
    <input type="text" id="tag-input" placeholder="e.g. ui-fix"/>

    <button id="commit-btn" class="btn primary">Commit</button>

    <section class="button-group">
      <button id="merge-btn" class="btn">Merge</button>
      <button id="rollback-btn" class="btn">Rollback</button>
      <button id="timeline-btn" class="btn">Timeline</button>
      <button id="settings-btn" class="btn">Settings</button>
      <button id="logout-btn" class="btn danger">Log Out</button>
    </section>

    <p id="status-message" class="message"></p>
  </div>

  <!-- ───────── SETTINGS ───────── -->
  <div class="container" id="settings-panel" style="display:none">
    <h2 class="header">Settings</h2>

    <label for="openai-key">OpenAI API Key</label>
    <input type="text" id="openai-key" placeholder="sk-…" />

    <label for="backend-url">Backend URL</label>
    <input type="text" id="backend-url" placeholder="https://…" />

    <label for="repo-hook">Repo Hook URL</label>
    <input type="text" id="repo-hook" placeholder="https://…" />

    <div class="button-group">
      <button id="save-settings" class="btn primary small">Save</button>
      <button id="back-btn" class="btn small">Back</button>
    </div>
  </div>

  <!-- ───────── MERGE ───────── -->
  <div class="container" id="merge-panel" style="display:none">
    <h2 class="header">Merge Branches</h2>

    <label for="merge-source">Source Branch</label>
    <select id="merge-source"></select>

    <label for="merge-target">Target Branch</label>
    <select id="merge-target"></select>

    <div class="button-group">
      <button id="execute-merge" class="btn primary small">Confirm</button>
      <button id="cancel-merge" class="btn small">Cancel</button>
    </div>

    <p id="merge-status" class="message"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
