<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ChatCommit Options</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Tahoma, sans-serif;
      padding: 16px;
      width: 480px;
      height: 500px;
    }
    h1 {
      color: orange;
      text-align: center;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #00ff99;
    }
    input {
      width: 100%;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    button {
      width: 100%;
      background: #22c55e;
      color: #000;
      padding: 10px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      margin-top: 16px;
      font-size: 14px;
      cursor: pointer;
    }
    #status {
      margin-top: 16px;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
    }
    .success {
      background: #22c55e33;
      color: #22c55e;
    }
    .error {
      background: #ef444433;
      color: #ef4444;
    }
    .info {
      background: #3b82f633;
      color: #3b82f6;
    }
    #tokenInfo {
      word-break: break-all;
      max-height: 100px;
      overflow-y: auto;
      background: #222;
      padding: 8px;
      border-radius: 4px;
      font-family: monospace;
      margin-top: 10px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>ChatCommit Options</h1>
  
  <h2>API Settings</h2>
  <div>
    <label for="apiUrl">API URL:</label>
    <input type="text" id="apiUrl" placeholder="https://chatcommit.fly.dev">
    <button id="saveApiUrl">Save API URL</button>
  </div>
  
  <h2>Authentication</h2>
  <div>
    <button id="checkToken">Check Current Token</button>
    <button id="clearToken">Clear Token</button>
    <button id="testEndpoint">Test API Connection</button>
  </div>
  
  <div id="tokenSection" class="hidden">
    <h3>Current Token:</h3>
    <div id="tokenInfo"></div>
  </div>
  
  <div id="status" class="hidden"></div>
  
  <script src="options.js"></script>
</body>
</html>
